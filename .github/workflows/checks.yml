# Synced from LunaPinc/standards (sync/files/.github/workflows/checks.yml) by sync/sync.sh; edit it there.
# Runs every hook in prek.toml over all files, at both stages, on PRs and on main. The job name
# `checks` is the status check the organisation ruleset protect-main requires. Toolchains are set up
# for the stacks the repo has; steps a stack contributes (its ci-steps.yml) sit between the generated
# markers; a repo that needs more adds an executable .github/ci-setup.sh.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Lets a repo's ci-setup.sh assume an AWS role through GitHub's OIDC token; no role trusts a repo
  # until that repo's own infrastructure creates one.
  id-token: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect stacks
        id: stacks
        run: |
          has() { [ -n "$(git ls-files "$@")" ] && echo true || echo false; }
          {
            echo "rust=$(has '*Cargo.toml')"
            echo "node=$(has '*package.json')"
            echo "rust-workspaces=$(git ls-files '*Cargo.lock' | xargs -r -n1 dirname | paste -sd ' ' -)"
          } >> "$GITHUB_OUTPUT"

      # BEGIN LunaPinc/standards: generated by sync/sync.sh, edit in LunaPinc/standards
      # END LunaPinc/standards

      - name: Rust toolchains
        if: steps.stacks.outputs.rust == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - if: steps.stacks.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ steps.stacks.outputs.rust-workspaces }}

      - if: steps.stacks.outputs.rust == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny

      - if: steps.stacks.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install every yarn project
        if: steps.stacks.outputs.node == 'true'
        run: |
          corepack enable
          git ls-files '*yarn.lock' | while read -r lock; do
            echo "::group::yarn install in $(dirname "$lock")"
            (cd "$(dirname "$lock")" && yarn install --immutable) </dev/null
            echo "::endgroup::"
          done

      - name: Repo-specific setup
        if: hashFiles('.github/ci-setup.sh') != ''
        run: .github/ci-setup.sh

      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: 0.5.11
          install-only: true

      # no-commit-to-branch guards laptops; CI checks out main itself on push.
      - name: Commit-stage hooks
        run: SKIP=no-commit-to-branch prek run --all-files --show-diff-on-failure

      - name: Push-stage hooks
        run: prek run --all-files --stage pre-push
