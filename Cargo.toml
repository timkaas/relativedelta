[package]
name = "relativedelta"
version = "0.0.0-replace-me"
readme = "README.md"
description = "Date rules as values, like Python's dateutil.relativedelta: set and shift dates by calendar months, years and weekdays, for jiff, time and chrono."
keywords = ["dateutil", "calendar", "date-arithmetic", "jiff", "chrono"]
edition = "2024"
rust-version = "1.88.0"
license = "MPL-2.0"
repository = "https://github.com/LunaPinc/relativedelta"
documentation = "https://docs.rs/relativedelta"
categories = ["date-and-time", "no-std", "no-std::no-alloc"]
# The source, its docs and the markdown it compiles as doctests; CI and tooling stay in the repo.
include = ["/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[lib]
name = "relativedelta"
path = "src/lib.rs"

[features]
default = ["num-traits/libm"]
std = ["chrono?/std", "chrono?/clock", "time?/std", "jiff?/std", "num-integer/std", "num-traits/std", "thiserror/std"]
time = ["dep:time", "dep:time-core"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
serde = ["std", "dep:serde", "chrono?/serde", "time?/serde"]
schemars = ["std", "dep:schemars"]

[dependencies]
chrono = { version = "0.4.45", optional = true, default-features = false }
time = { version = "0.3.55", optional = true, default-features = false }
jiff = { version = "1.0.3", optional = true, default-features = false }
num-integer = { version = "0.1.47", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }
time-core = { version = "0.1.9", optional = true }
schemars = { version = "1.2.3", optional = true }

[dev-dependencies]
anyhow = "1.0"
# POSIX time zones (`alloc`) let the tests cover DST gaps without bundling a tz database.
jiff = { version = "1.0.3", default-features = false, features = ["alloc"] }
serde_json = "1.0"
similar-asserts = "2.0"


[package.metadata.docs.rs]
all-features = true
