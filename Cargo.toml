[package]
name = "relativedelta"
version = "0.0.0-replace-me"
readme = "README.md"
description = "Complex date arithmetic: add/subtract months and years without errors, target weekdays, lock dates. Better than Duration for semantic calendar operations."
keywords = ["datetime", "relative", "deltatime", "calendar", "date-arithmetic"]
edition = "2024"
rust-version = "1.88.0"
license = "MPL-2.0+"
homepage = "https://github.com/timkaas/relativedelta/"
repository = "https://github.com/timkaas/relativedelta/"
documentation = "https://docs.rs/relativedelta"
categories = ["date-and-time"]

[lib]
name = "relativedelta"
path = "src/lib.rs"

[features]
default = ["num-traits/libm"]
std = ["chrono?/std", "chrono?/clock", "time?/std", "num-integer/std", "num-traits/std", "thiserror/std"]
time = ["dep:time", "dep:time-core"]
chrono = ["dep:chrono"]
serde = ["dep:serde", "chrono?/serde", "time?/serde"]
schemars = ["dep:schemars"]

[dependencies]
chrono = { version = "0.4.45", optional = true, default-features = false }
time = { version = "0.3.55", optional = true, default-features = false }
num-integer = { version = "0.1.47", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
paste = "1.0.15"
thiserror = { version = "2.0.21", default-features = false }
time-core = { version = "0.1.9", optional = true }
schemars = { version = "1.2.3", optional = true }

[dev-dependencies]
anyhow = "1.0"
serde_json = "1.0"
similar-asserts = "2.0"

[build-dependencies]
regex = "1.12.3"

[package.metadata.docs.rs]
all-features = true
