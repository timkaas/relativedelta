# BEGIN LunaPinc/standards: generated by sync/sync.py, edit in LunaPinc/standards

# base: every repo. Fast hooks run at commit; a hook with `stages = ["pre-push"]` runs at push.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    # main is protected on GitHub: changes go through a branch and a PR.
    { id = "no-commit-to-branch" },
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    # GitHub Actions run by full commit SHA, which nobody can move, with the version in a comment
    # (`@<sha> # v1.2.3`); a tag or branch can be pointed at other code. Offline, so it can't verify
    # that the comment matches the SHA; Dependabot writes both.
    # pinact v5.0.2 needs Go >= 1.27.3; prek downloads one when the system Go is older.
    { id = "pinact", name = "pinact (actions pinned to a commit SHA)", entry = "pinact run --fix=false --no-api", language = "golang", language_version = ">=1.27.3", additional_dependencies = ["github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.2"], files = "(^|/)(\\.github/workflows/[^/]+|action)\\.ya?ml$" },
    # Per-developer files: JetBrains settings and Finder metadata. They belong in each developer's
    # global gitignore, which every machine lacks until set up.
    { id = "no-personal-files", name = "no personal files (.idea/, .DS_Store)", language = "fail", entry = "Personal files: untrack them with `git rm -r --cached` and add .idea/ and .DS_Store to your global gitignore", files = "(^|/)(\\.idea/|\\.DS_Store$)" },
]

# rust: every Cargo workspace in the repo, through .lunapinc/cargo-each.
[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo +nightly fmt", entry = ".lunapinc/cargo-each +nightly fmt --all", language = "system", pass_filenames = false, files = "\\.rs$" },
    { id = "cargo-clippy", name = "cargo clippy", entry = ".lunapinc/cargo-each clippy --workspace --all-targets --all-features -- -D warnings", language = "system", pass_filenames = false, files = "\\.rs$|Cargo\\.(toml|lock)$" },
    { id = "cargo-test", name = "cargo test", entry = ".lunapinc/cargo-each test --workspace --all-features", language = "system", pass_filenames = false, files = "\\.rs$|Cargo\\.(toml|lock)$", stages = ["pre-push"] },
    { id = "cargo-doc", name = "cargo doc", entry = "env RUSTDOCFLAGS=-Dwarnings .lunapinc/cargo-each doc --workspace --no-deps --all-features", language = "system", pass_filenames = false, files = "\\.rs$|Cargo\\.(toml|lock)$", stages = ["pre-push"] },
    { id = "cargo-deny", name = "cargo deny (licences, advisories, sources)", entry = ".lunapinc/cargo-each deny --config .lunapinc/deny.toml check", language = "system", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]

# END LunaPinc/standards

# relativedelta's own checks: each feature set alone, a no_std build and the MSRV. CI installs their
# toolchains through .github/ci-setup.sh; locally, each script names the command when one is missing.
[[repos]]
repo = "local"
hooks = [
    { id = "feature-matrix", name = "clippy and tests per feature set", entry = "scripts/feature-matrix.sh", language = "system", pass_filenames = false, files = "\\.(rs|md)$|Cargo\\.toml$|^scripts/", stages = ["pre-push"] },
    { id = "no-std", name = "no_std build (thumbv7em-none-eabihf)", entry = "scripts/no-std.sh", language = "system", pass_filenames = false, files = "\\.rs$|Cargo\\.toml$|^scripts/", stages = ["pre-push"] },
    { id = "msrv", name = "tests on the MSRV", entry = "scripts/msrv.sh", language = "system", pass_filenames = false, files = "\\.(rs|md)$|Cargo\\.toml$|^scripts/", stages = ["pre-push"] },
]
